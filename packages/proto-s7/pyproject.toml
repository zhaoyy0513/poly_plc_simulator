[project]
name = "poly-proto-s7"
version = "0.1.0"
description = "Siemens S7 server adapter built on python-snap7"
requires-python = ">=3.10"
dependencies = ["poly-contracts", "poly-core", "python-snap7>=3.0"]

[build-system]
requires = ["hatchling"]
build-backend = "hatchling.build"

[tool.hatch.build.targets.wheel]
packages = ["poly_s7"]

[tool.uv.sources]
poly-contracts = { workspace = true }
poly-core = { workspace = true }

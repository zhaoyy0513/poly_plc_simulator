[project]
name = "poly-contracts"
version = "0.1.0"
description = "Shared configuration and runtime contracts"
requires-python = ">=3.10"
dependencies = ["pydantic>=2.7"]

[build-system]
requires = ["hatchling"]
build-backend = "hatchling.build"

[tool.hatch.build.targets.wheel]
packages = ["poly_contracts"]

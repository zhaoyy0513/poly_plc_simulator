[project]
name = "poly-proto-modbus"
version = "0.1.0"
description = "Minimal Modbus TCP server adapter"
requires-python = ">=3.10"
dependencies = ["poly-contracts", "poly-core"]

[build-system]
requires = ["hatchling"]
build-backend = "hatchling.build"

[tool.hatch.build.targets.wheel]
packages = ["poly_modbus"]

[tool.uv.sources]
poly-contracts = { workspace = true }
poly-core = { workspace = true }

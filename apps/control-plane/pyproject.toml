[project]
name = "poly-control-plane"
version = "0.1.0"
description = "FastAPI control plane: sites, servers, tags, live values and logs"
requires-python = ">=3.10"
dependencies = [
    "poly-contracts",
    "poly-core",
    "poly-agent",
    "fastapi>=0.115",
    "uvicorn>=0.30",
    "sqlmodel>=0.0.22",
    "httpx>=0.27",
    "paramiko",
]

[build-system]
requires = ["hatchling"]
build-backend = "hatchling.build"

[tool.hatch.build.targets.wheel]
packages = ["poly_control_plane"]

[tool.uv.sources]
poly-contracts = { workspace = true }
poly-core = { workspace = true }
poly-agent = { workspace = true }

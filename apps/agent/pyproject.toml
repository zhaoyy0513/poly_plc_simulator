[project]
name = "poly-agent"
version = "0.1.0"
description = "Local supervisor that launches and monitors simulator instances"
requires-python = ">=3.10"
dependencies = ["poly-contracts", "httpx>=0.27"]

[build-system]
requires = ["hatchling"]
build-backend = "hatchling.build"

[tool.hatch.build.targets.wheel]
packages = ["poly_agent"]

[tool.uv.sources]
poly-contracts = { workspace = true }

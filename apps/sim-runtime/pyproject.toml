[project]
name = "poly-sim-runtime"
version = "0.1.0"
description = "Single-instance simulator runtime (one process = one server instance)"
requires-python = ">=3.10"
dependencies = [
    "poly-contracts",
    "poly-core",
    "poly-proto-modbus",
    "poly-proto-s7",
    "poly-proto-opcua",
    "fastapi>=0.115",
    "uvicorn>=0.30",
]

[build-system]
requires = ["hatchling"]
build-backend = "hatchling.build"

[tool.hatch.build.targets.wheel]
packages = ["poly_sim_runtime"]

[tool.uv.sources]
poly-contracts = { workspace = true }
poly-core = { workspace = true }
poly-proto-modbus = { workspace = true }
poly-proto-s7 = { workspace = true }
poly-proto-opcua = { workspace = true }

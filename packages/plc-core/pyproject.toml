[project]
name = "poly-core"
version = "0.1.0"
description = "Protocol-agnostic tag model, codecs and simulation engine"
requires-python = ">=3.10"
dependencies = ["poly-contracts", "pydantic>=2.7"]

[build-system]
requires = ["hatchling"]
build-backend = "hatchling.build"

[tool.hatch.build.targets.wheel]
packages = ["poly_core"]

[tool.uv.sources]
poly-contracts = { workspace = true }

[project]
name = "poly-plc-simulator"
version = "0.1.0"
description = "Multi-protocol PLC server simulator (Modbus TCP / S7 / OPC UA) with a web console"
requires-python = ">=3.10"
dependencies = ["poly-control-plane", "poly-agent", "poly-sim-runtime"]

[tool.uv]
package = false

[tool.uv.sources]
poly-control-plane = { workspace = true }
poly-agent = { workspace = true }
poly-sim-runtime = { workspace = true }

[tool.uv.workspace]
members = ["packages/*", "apps/sim-runtime", "apps/agent", "apps/control-plane"]

[tool.ruff]
line-length = 100
target-version = "py310"

[tool.pytest.ini_options]
testpaths = ["tests"]
addopts = "-q"

[dependency-groups]
dev = ["pytest>=8", "pymodbus>=3.11,<4"]
